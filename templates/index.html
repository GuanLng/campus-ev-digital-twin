<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>校园电动车数字孪生监管系统</title>
<link rel="icon" href="data:,">
<script src="/static/three.min.js"></script>
<script src="/static/camera_utils.js"></script>
<script src="/static/drawing_utils.js"></script>
<script src="/static/hands.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{font-family:'Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;overflow:hidden}
.header{background:linear-gradient(135deg,#1e293b,#334155);padding:14px 30px;display:flex;align-items:center;border-bottom:2px solid #3b82f6}
.header h1{font-size:20px}
.header h1 span{color:#3b82f6}
.toolbar{display:flex;gap:10px;padding:8px 30px;background:#1e293b;align-items:center;border-bottom:1px solid #334155;flex-wrap:wrap}
.btn{padding:6px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:disabled{background:#475569;cursor:not-allowed}
.btn-purple{background:#8b5cf6;color:#fff}
.btn-purple.active{background:#6d28d9}
.btn-warning{background:#f59e0b;color:#000}
.stats{display:flex;gap:16px;margin-left:auto;font-size:13px}
.stats .num{font-weight:700;font-size:16px}
.s-green .num{color:#22c55e}
.s-red .num{color:#ef4444}
.s-blue .num{color:#3b82f6}
.main{display:flex;height:calc(100vh - 90px)}
.sidebar{width:200px;background:#1e293b;padding:12px;border-right:1px solid #334155;overflow-y:auto;flex-shrink:0}
.sidebar h3{font-size:13px;color:#94a3b8;margin-bottom:10px}
.card{background:#334155;border-radius:8px;padding:8px;margin-bottom:10px;cursor:grab;border:2px solid transparent;position:relative}
.card img{width:100%;height:80px;object-fit:cover;border-radius:4px}
.card .label{font-size:11px;margin-top:4px;text-align:center;color:#cbd5e1}
.card .badge{position:absolute;top:4px;right:4px;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.badge-ok{background:#22c55e;color:#000}
.badge-no{background:#ef4444;color:#fff}
.badge-wait{background:#f59e0b;color:#000}
#scene3d{flex:1;position:relative;background:#1a2a3a}
#scene3d canvas{display:block;width:100%!important;height:100%!important}
.scene-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#475569;pointer-events:none;z-index:1;transition:opacity .5s}
.scene-hint .icon{font-size:50px}
.scene-hint p{font-size:14px;margin-top:8px}
.scene-hint.hidden{opacity:0}
#camBox{position:absolute;bottom:20px;right:20px;width:200px;height:150px;border:2px solid #475569;border-radius:8px;overflow:hidden;z-index:100;background:#000;display:none}
#camBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cursor{position:fixed;pointer-events:none;z-index:999;display:none}
#cursor .dot{width:16px;height:16px;border-radius:50%;background:rgba(139,92,246,.7);border:2px solid #8b5cf6;position:absolute;top:-8px;left:-8px}
#cursor .ring{width:40px;height:40px;border-radius:50%;border:2px solid rgba(139,92,246,.3);position:absolute;top:-20px;left:-20px}
#cursor.pinch .dot{background:rgba(239,68,68,.8);border-color:#ef4444;transform:scale(1.3)}
#cursor.pinch .ring{border-color:rgba(239,68,68,.5);width:30px;height:30px;top:-15px;left:-15px}
#toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-weight:600;z-index:9999;display:none;animation:fadeIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#toast.show{display:block}
#toast.ok{background:#22c55e;color:#000}
#toast.err{background:#ef4444;color:#fff}
#toast.info{background:#3b82f6;color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:translateX(0)}}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#1e293b}
::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
</style>
</head>
<body>
<div class=header><h1>🏫 <span>校园电动车</span>数字孪生监管系统</h1></div>
<div class=toolbar>
<button class="btn btn-primary" id=btnDetect onclick=detectAll()>🔍 YOLO检测</button>
<button class="btn btn-purple" id=btnGesture onclick=toggleGesture()>✋ 手势:关</button>
<button class="btn btn-warning" onclick=resetAll()>🔄 重置</button>
<div class=stats>
<span class="s-green">🟢 合规 <span class=num id=ctOk>0</span></span>
<span class="s-red">🔴 违规 <span class=num id=ctBad>0</span></span>
<span class="s-blue">📦 已放 <span class=num id=ctPlaced>0</span></span>
<span id=gestureStatus style="font-size:12px;color:#94a3b8;margin-left:8px"></span>
</div>
</div>
<div class=main>
<div class=sidebar><h3>📷 图片资源</h3><div id=cards>加载中...</div></div>
<div id=scene3d>
<div class=scene-hint id=sceneHint><div class=icon>🏗️</div><p>加载3D场景中...</p></div>
</div>
</div>
<div id=camBox><video id=webcam></video></div>
<div id=cursor><div class=dot></div><div class=ring></div></div>
<div id=toast></div>
<script>

let scene, camera, renderer, ground;
const PARKING={x1:-5,z1:-4,x2:5,z2:4};
const BIKE_COLORS=[0x22c55e,0x3b82f6,0xef4444,0xf59e0b,0x8b5cf6,0xec4899];
let IMGS=[], placed={};
const drag={active:false,source:null,clone:null,offX:0,offY:0,el3d:null,bikeIdx:-1};

function isInPark(x,z){return x>=PARKING.x1&&x<=PARKING.x2&&z>=PARKING.z1&&z<=PARKING.z2}

function initScene(){
  const box=document.getElementById('scene3d');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x87ceeb);
  camera=new THREE.PerspectiveCamera(45,box.clientWidth/box.clientHeight,0.1,100);
  camera.position.set(0,18,16); camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(box.clientWidth,box.clientHeight); renderer.shadowMap.enabled=true;
  box.appendChild(renderer.domElement);
  const amb=new THREE.AmbientLight(0xffffff,0.6); scene.add(amb);
  const dir=new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(10,20,10); dir.castShadow=true; scene.add(dir);
  const gMat=new THREE.MeshLambertMaterial({color:0x7ec87e});
  ground=new THREE.Mesh(new THREE.PlaneGeometry(40,28),gMat);
  ground.rotation.x=-Math.PI/2; ground.position.set(0,0,0); ground.receiveShadow=true; scene.add(ground);
  // 不可见的点击平面（覆盖整个地面，用于拖拽放置检测）
  const clickPlane=new THREE.Mesh(new THREE.PlaneGeometry(40,28),new THREE.MeshBasicMaterial({visible:false,depthWrite:false}));
  clickPlane.rotation.x=-Math.PI/2; clickPlane.position.set(0,0,0); clickPlane.name='clickPlane'; scene.add(clickPlane);
  scene.add(new THREE.GridHelper(40,20,0x555555,0x444444));
  // 道路（带白线）
  const rm=new THREE.MeshLambertMaterial({color:0x888888});
  const r1=new THREE.Mesh(new THREE.PlaneGeometry(40,3.5),rm); r1.rotation.x=-Math.PI/2; r1.position.set(0,0.01,-10); scene.add(r1);
  const r2=new THREE.Mesh(new THREE.PlaneGeometry(3.5,28),rm); r2.rotation.x=-Math.PI/2; r2.position.set(-12,0.01,0); scene.add(r2);
  // 道路白线
  const wlMat=new THREE.MeshBasicMaterial({color:0xffffff});
  for(let i=-15;i<=15;i+=3){const wl=new THREE.Mesh(new THREE.PlaneGeometry(0.1,1.5),wlMat);wl.rotation.x=-Math.PI/2;wl.position.set(i,0.015,-10);scene.add(wl)}
  for(let i=-10;i<=10;i+=3){const wl=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.1),wlMat);wl.rotation.x=-Math.PI/2;wl.position.set(-12,0.015,i);scene.add(wl)}
  // 建筑（马路四角，避开十字路口）
  const bData=[
    [-17,-14,5,3.5,4,0x4a90d9],[-5,-14,5,3,4,0x6b8e23],
    [-17,-5,5,3,4,0xcd853f],[-5,-5,5,3.5,4,0x8b7355],
    [12,-5,5,2.5,4,0xa0522d],[-17,8,5,2.5,4,0x4682b4]
  ];
  bData.forEach(b=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(b[2],b[3],b[4]),new THREE.MeshLambertMaterial({color:b[5]}));
    m.position.set(b[0],b[3]/2,b[1]); m.castShadow=true; scene.add(m);
    // 窗户效果（修复位置：wy是距底部高度，建筑底部在y=0）
    const winMat=new THREE.MeshBasicMaterial({color:0xffffcc});
    if(b[3]>2){for(let wy=0.8;wy<b[3]-0.3;wy+=1.2){for(let wx=-b[2]/2+0.8;wx<b[2]/2-0.5;wx+=1.2){
      const win=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.5),winMat);
      win.position.set(b[0]+wx, wy+0.25, b[1]+b[4]/2+0.01);scene.add(win)
    }}}
  });
  // 树（避开建筑和马路）
  [[-15,-9],[-13,-1],[-15,5],[0,-9],[8,-1],[12,-1],[9,8],[-3,13],[0,12],[3,13],[12,9],[-14,11],[-6,12]].forEach(t=>{
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,1),new THREE.MeshLambertMaterial({color:0x8B4513}));
    tr.position.set(t[0],0.5,t[1]); scene.add(tr);
    const cr=new THREE.Mesh(new THREE.SphereGeometry(0.7,6),new THREE.MeshLambertMaterial({color:0x2d8a2d}));
    cr.position.set(t[0],1.2,t[1]); cr.scale.y=0.8; scene.add(cr);
  });
  // 路灯（沿马路）
  [[-17,-9],[-17,9],[17,-9],[17,9],[-11,-17],[-11,17]].forEach(t=>{
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,1.5),new THREE.MeshLambertMaterial({color:0x555555}));
    pole.position.set(t[0],0.75,t[1]); scene.add(pole);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(0.12),new THREE.MeshLambertMaterial({color:0xffff88}));
    lamp.position.set(t[0],1.6,t[1]); scene.add(lamp);
  });
  // 停车位
  const pts=[new THREE.Vector3(PARKING.x1,0.02,PARKING.z1),new THREE.Vector3(PARKING.x2,0.02,PARKING.z1),new THREE.Vector3(PARKING.x2,0.02,PARKING.z2),new THREE.Vector3(PARKING.x1,0.02,PARKING.z2)];
  const g=new THREE.BufferGeometry().setFromPoints(pts.concat(pts[0]));
  scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xf59e0b})));
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(PARKING.x2-PARKING.x1,PARKING.z2-PARKING.z1),new THREE.MeshLambertMaterial({color:0xf59e0b,transparent:true,opacity:0.12}));
  fill.rotation.x=-Math.PI/2; fill.position.set((PARKING.x1+PARKING.x2)/2,0.015,(PARKING.z1+PARKING.z2)/2); scene.add(fill);
  // P标记
  const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
  const ctx=cv.getContext('2d'); ctx.fillStyle='rgba(245,158,11,0.6)'; ctx.font='bold 80px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('P',64,64);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  spr.position.set((PARKING.x1+PARKING.x2)/2,1.5,(PARKING.z1+PARKING.z2)/2); spr.scale.set(2,2,1); scene.add(spr);
  document.getElementById('sceneHint').classList.add('hidden');
  window.addEventListener('resize',()=>{camera.aspect=box.clientWidth/box.clientHeight;camera.updateProjectionMatrix();renderer.setSize(box.clientWidth,box.clientHeight)});
  anim();
}

function anim(){requestAnimationFrame(anim);renderer.render(scene,camera)}

function createBike(color){
  const g=new THREE.Group();
  const wm=new THREE.MeshLambertMaterial({color:0x333333});
  const fm=new THREE.MeshLambertMaterial({color});
  const spMat=new THREE.MeshLambertMaterial({color:0x888888});
  const R=0.5;  // 轮胎半径
  const TR=0.07; // 轮胎管径
  // 前后轮（直立！从俯视看是两条线）
  const wg=new THREE.TorusGeometry(R,TR,8,16);
  const w1=new THREE.Mesh(wg,wm);w1.position.set(-0.65,TR,0);w1.rotation.z=Math.PI/2;g.add(w1);
  const w2=new THREE.Mesh(wg,wm);w2.position.set(0.65,TR,0);w2.rotation.z=Math.PI/2;g.add(w2);
  // 辐条（从轮心到轮圈）
  for(let s=-1;s<=1;s+=2){
    for(let a=0;a<6;a++){
      const ang=a*Math.PI/3;
      const sp=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,R-0.08),spMat);
      sp.position.set(s*0.65,TR+R*0.5,0);
      sp.rotation.x=-Math.PI/2;sp.rotation.z=ang;
      g.add(sp);
    }
  }
  // 车架节点坐标 (x,y) - 底部在y=TR
  const nodes={
    rear:[-0.65,TR],     // 后轮轴
    crank:[-0.1,TR],     // 中轴
    seat:[-0.05,TR+0.55], // 坐垫底部
    head:[0.6,TR+0.5],   // 车把底部
    front:[0.65,TR],     // 前轮轴
  };
  // 连接管
  const conns=[
    [nodes.rear,nodes.crank],[nodes.crank,nodes.seat],[nodes.seat,nodes.rear],
    [nodes.front,nodes.head],[nodes.crank,nodes.front],[nodes.seat,nodes.head],
  ];
  conns.forEach(c=>{
    const dx=c[1][0]-c[0][0],dy=c[1][1]-c[0][1];
    const len=Math.sqrt(dx*dx+dy*dy);
    const tube=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,len,4),fm);
    tube.position.set((c[0][0]+c[1][0])/2,(c[0][1]+c[1][1])/2,0);
    if(len>0.01)tube.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,0).normalize());
    g.add(tube);
  });
  // 坐垫
  const st=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.04,0.1),new THREE.MeshLambertMaterial({color:0x222222}));
  st.position.set(nodes.seat[0],nodes.seat[1]+0.02,0);g.add(st);
  // 车把（横管）
  const hb=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.35),new THREE.MeshLambertMaterial({color:0x555555}));
  hb.position.set(nodes.head[0],nodes.head[1]+0.05,0);hb.rotation.x=Math.PI/2;g.add(hb);
  g.scale.set(1.0,1.0,1.0);
  g.position.y=1.1;
  return g;
}

function bikeColor(idx){
  return BIKE_COLORS[idx%BIKE_COLORS.length];
}

function placeBike(idx,x,z){
  const inPark=isInPark(x,z);
  const c=bikeColor(idx);
  const b=createBike(c);b.position.set(x,0,z);scene.add(b);
  placed[idx]={mesh:b,idx,x,z,com:inPark};
  st();toast(inPark?'✅ 合规':'❌ 违规',inPark?'ok':'err');
}

function moveBike(idx,x,z){
  if(!placed[idx])return;
  const inPark=isInPark(x,z);
  const c=bikeColor(idx);
  scene.remove(placed[idx].mesh);
  const b=createBike(c);b.position.set(x,0,z);scene.add(b);
  placed[idx]={mesh:b,idx,x,z,com:inPark};
  st();toast(inPark?'✅ 合规':'❌ 违规',inPark?'ok':'err');
}

function setup3DDrag(){
  const cv=renderer.domElement;
  let sel=null,sIdx=-1,active=false,plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();
  cv.addEventListener('mousedown',e=>{
    const r=cv.getBoundingClientRect();
    const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);
    const bikes=Object.values(placed).filter(p=>p.mesh).map(p=>p.mesh);
    const hits=ray.intersectObjects(bikes,true);
    if(hits.length>0){
      let o=hits[0].object;while(o.parent&&!Object.values(placed).find(p=>p.mesh===o))o=o.parent;
      const en=Object.values(placed).find(p=>p.mesh===o);
      if(en){sel=en.mesh;sIdx=en.idx;active=true;ray.ray.intersectPlane(plane,pt);drag.offX=pt.x-sel.position.x;drag.offZ=pt.z-sel.position.z}
    }
  });
  cv.addEventListener('mousemove',e=>{
    if(!active||!sel)return;
    const r=cv.getBoundingClientRect();
    const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);ray.ray.intersectPlane(plane,pt);
    sel.position.set(Math.max(-18,Math.min(18,pt.x-drag.offX)),0,Math.max(-12,Math.min(12,pt.z-drag.offZ)));
  });
  cv.addEventListener('mouseup',()=>{
    if(!active||!sel||sIdx<0){active=false;return}
    const x=sel.position.x,z=sel.position.z,c=isInPark(x,z)?0x22c55e:0xef4444;
    if(placed[sIdx]){const inPark=isInPark(x,z);placed[sIdx].x=x;placed[sIdx].z=z;placed[sIdx].com=inPark;scene.remove(sel);const b=createBike(bikeColor(sIdx));b.position.set(x,0,z);scene.add(b);placed[sIdx].mesh=b;st()}
    sel=null;sIdx=-1;active=false;
  });
}

async function detectAll(){
  const btn=document.getElementById('btnDetect');btn.disabled=true;btn.textContent='⏳检测...';
  for(let i=0;i<IMGS.length;i++){try{const r=await fetch('/api/detect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file:IMGS[i].file})});const d=await r.json();IMGS[i].detected=true;IMGS[i].isBike=d.has_bicycle}catch(e){}renderCards()}
  btn.disabled=false;btn.textContent='🔍YOLO检测';toast('✅检测完成','ok');
}

function renderCards(){
  const c=document.getElementById('cards');c.innerHTML='';
  IMGS.forEach((img,i)=>{
    const cd=document.createElement('div');cd.className='card';cd.dataset.idx=i;
    let badge=img.detected?img.isBike?'<span class="badge badge-ok">🚲</span>':'<span class="badge badge-no">❌</span>':'<span class="badge badge-wait">⏳</span>';
    cd.innerHTML=badge+'<img src="'+img.url+'" style="width:100%;height:80px;object-fit:cover;border-radius:4px"><div class=label>'+img.label+'</div>';
    cd.onmousedown=e=>{
      if(!camera){toast('⏳3D场景未就绪','info');return}
      if(img.detected&&!img.isBike){toast('❌非自行车','info');return}
      if(placed[i]&&placed[i].mesh){toast('🔄已放置，在场景中拖动','info');return}
      drag.active=true;drag.source='card';drag.bikeIdx=i;
      const cl=document.createElement('img');cl.src=img.url;
      cl.style.cssText='position:fixed;width:100px;height:75px;object-fit:cover;border-radius:6px;z-index:1000;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5)';
      document.body.appendChild(cl);drag.clone=cl;drag.offX=50;drag.offY=37;
      cl.style.left=(e.clientX-50)+'px';cl.style.top=(e.clientY-37)+'px';
      const mv=e2=>{if(drag.clone){drag.clone.style.left=(e2.clientX-50)+'px';drag.clone.style.top=(e2.clientY-37)+'px'}};
      const up=e2=>{
        document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
        if(drag.clone){drag.clone.remove();drag.clone=null}
        if(!drag.active||!camera||drag.bikeIdx<0){drag.active=false;return}
        const cv=document.querySelector('#scene3d canvas');
        if(!cv){drag.active=false;return}
        // 计算3D位置
        let x=0,z=0;
        try{
          const r=cv.getBoundingClientRect();
          if(e2.clientX>=r.left&&e2.clientX<=r.right&&e2.clientY>=r.top&&e2.clientY<=r.bottom){
            const m=new THREE.Vector2(((e2.clientX-r.left)/r.width)*2-1,-((e2.clientY-r.top)/r.height)*2+1);
            const ray=new THREE.Raycaster();ray.setFromCamera(m,camera);
            const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
            const pt=new THREE.Vector3();
            if(ray.ray.intersectPlane(plane,pt)){x=Math.max(-18,Math.min(18,pt.x));z=Math.max(-12,Math.min(12,pt.z))}
          }
        }catch(e){console.error('drop err',e)}
        // 确保自行车出现
        if(placed[drag.bikeIdx]&&placed[drag.bikeIdx].mesh)moveBike(drag.bikeIdx,x,z);
        else placeBike(drag.bikeIdx,x,z);
        drag.active=false;drag.source=null;drag.bikeIdx=-1;
      };
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    };
    c.appendChild(cd);
  });
}

async function loadImgs(){
  try{const r=await fetch('/api/images');IMGS=await r.json();IMGS.forEach(x=>{x.detected=false;x.isBike=false});renderCards()}catch(e){}
}

function st(){
  const vs=Object.values(placed).filter(p=>p.mesh);
  document.getElementById('ctOk').textContent=vs.filter(v=>v.com).length;
  document.getElementById('ctBad').textContent=vs.filter(v=>!v.com).length;
  document.getElementById('ctPlaced').textContent=vs.length;
}

function toast(m,t){const o=document.getElementById('toast');o.textContent=m;o.className='toast show '+t;clearTimeout(o._timer);o._timer=setTimeout(()=>o.classList.remove('show'),2000)}

function resetAll(){Object.values(placed).filter(p=>p.mesh).forEach(p=>scene.remove(p.mesh));placed={};st();toast('🔄已重置','info')}

let gestureEnabled=false,gestureReady=false;
const gesture={isPinching:false,x:0,y:0,prev:false};
function toggleGesture(){gestureEnabled?stopGesture():initGesture()}
function initGesture(){
  const btn=document.getElementById('btnGesture');btn.textContent='✋加载中';btn.disabled=true;
  const video=document.getElementById('webcam');document.getElementById('camBox').style.display='block';
  const hands=new Hands({locateFile:f=>'/static/'+f});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.3,minTrackingConfidence:.3});
  hands.onResults(r=>{
    if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){
      const lm=r.multiHandLandmarks[0],t=lm[4],i=lm[8];
      gesture.x=(1-i.x)*window.innerWidth;gesture.y=i.y*window.innerHeight;
      // 用像素距离判断捏合（拇指和食指间距<50像素=捏合）
      const pxDist=Math.hypot((t.x-i.x)*window.innerWidth,(t.y-i.y)*window.innerHeight);
      gesture.prev=gesture.isPinching;gesture.isPinching=pxDist<50;
      document.getElementById('gestureStatus').textContent='🖐️手部已识别'+(gesture.isPinching?' 🤏捏合中':'');
      const c=document.getElementById('cursor');c.style.display='block';c.style.left=gesture.x+'px';c.style.top=gesture.y+'px';
      c.className=gesture.isPinching?'pinch':'';
      // 手势拖拽：派发鼠标事件到DOM+canvas（同时支持卡片和3D自行车）
      const me=(t)=>new MouseEvent(t,{clientX:gesture.x,clientY:gesture.y,bubbles:true});
      const cv=document.querySelector('#scene3d canvas');
      if(gesture.isPinching&&!gesture.prev){
        const el=document.elementFromPoint(gesture.x,gesture.y);
        if(el)el.dispatchEvent(me('mousedown'));
        if(cv&&cv!==el)cv.dispatchEvent(me('mousedown'));
      }else if(gesture.isPinching&&gesture.prev){
        document.dispatchEvent(me('mousemove'));
        if(cv)cv.dispatchEvent(me('mousemove'));
      }else if(!gesture.isPinching&&gesture.prev){
        document.dispatchEvent(me('mouseup'));
        if(cv)cv.dispatchEvent(me('mouseup'));
      }
    }else{gesture.prev=gesture.isPinching;gesture.isPinching=false;document.getElementById('cursor').style.display='none';document.getElementById('gestureStatus').textContent='⏳未检测到手'}
  });
  new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:320,height:240}).start().then(()=>{gestureReady=true;gestureEnabled=true;btn.textContent='✋手势:开';btn.className='btn btn-purple active';btn.disabled=false}).catch(()=>{btn.textContent='✋失败';btn.disabled=false})
}
function stopGesture(){gestureEnabled=false;gestureReady=false;document.getElementById('camBox').style.display='none';document.getElementById('cursor').style.display='none';const btn=document.getElementById('btnGesture');btn.textContent='✋手势:关';btn.className='btn btn-purple'}

loadImgs();
let _wait=0;
function _try(){if(typeof THREE!=='undefined'){initScene();setup3DDrag()}else if(_wait++<50){document.getElementById('sceneHint').innerHTML='<div class=icon>⏳</div><p>加载Three.js中...</p>';setTimeout(_try,200)}else{document.getElementById('sceneHint').innerHTML='<div class=icon>❌</div><p>加载失败</p>'}}
setTimeout(_try,100);
</script></body></html>
