<script>
let scene, camera, renderer, ground, sceneBox, sunLight;
const PARKING={x1:-5,z1:-4,x2:5,z2:4};
const ROAD_H_Z=10.8;
const ROAD_V_X=-11.2;
const BIKE_COLORS=[0x3f7cf6,0x41b37d,0xd15f5f,0x555f73,0x7c57bf,0xd09331];
const LOCAL_MODE=location.protocol==='file:';
const OBJ_CACHE=new Map();
const FALLBACK_IMAGES=[
  {file:'图片/48c8577053cbc3f4cfe5f5ac15fe7fa3.jpg',label:'校园场景1'},
  {file:'edd8faeddb849e2b4106d30d5fa454be.jpg',label:'校园场景2'},
  {file:'车.jpg',label:'校园场景3'}
];
let IMGS=[], placed={};
const drag={active:false,source:null,clone:null,offX:0,offY:0,el3d:null,bikeIdx:-1};

function isInPark(x,z){return x>=PARKING.x1&&x<=PARKING.x2&&z>=PARKING.z1&&z<=PARKING.z2}

function assetPath(path){
  const clean=path.replace(/^\/+/,'');
  return LOCAL_MODE?'../'+clean:'/'+clean;
}

function loadTextAsset(path){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('GET',assetPath(path),true);
    xhr.onload=()=>{
      if(xhr.status===200||xhr.status===0) resolve(xhr.responseText);
      else reject(new Error(`load failed: ${path} (${xhr.status})`));
    };
    xhr.onerror=()=>reject(new Error(`network failed: ${path}`));
    xhr.send();
  });
}

function buildObjGeometry(faceTriples,vertices){
  const positions=[];
  faceTriples.forEach(face=>{
    face.forEach(idx=>{
      const v=vertices[idx];
      if(!v) return;
      positions.push(v[0],v[1],v[2]);
    });
  });
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geometry.computeVertexNormals();
  return geometry;
}

function parseSimpleOBJ(text){
  const vertices=[];
  const groups=new Map();
  let current='default';
  const ensureGroup=name=>{
    if(!groups.has(name)) groups.set(name,[]);
    return groups.get(name);
  };
  ensureGroup(current);
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();
    if(!line||line.startsWith('#')) return;
    if(line.startsWith('v ')){
      const [,x,y,z]=line.split(/\s+/);
      vertices.push([parseFloat(x),parseFloat(y),parseFloat(z)]);
      return;
    }
    if(line.startsWith('g ')||line.startsWith('o ')){
      current=line.split(/\s+/).slice(1).join('_')||'default';
      ensureGroup(current);
      return;
    }
    if(line.startsWith('f ')){
      const ids=line.split(/\s+/).slice(1).map(token=>{
        const index=parseInt(token.split('/')[0],10);
        return index>0?index-1:vertices.length+index;
      });
      for(let i=1;i<ids.length-1;i++){
        ensureGroup(current).push([ids[0],ids[i],ids[i+1]]);
      }
    }
  });
  const parsed=[];
  groups.forEach((faces,name)=>{
    if(!faces.length) return;
    parsed.push({name,geometry:buildObjGeometry(faces,vertices)});
  });
  return parsed;
}

async function loadSimpleOBJ(path,materialMap){
  let parsed=OBJ_CACHE.get(path);
  if(!parsed){
    parsed=parseSimpleOBJ(await loadTextAsset(path));
    OBJ_CACHE.set(path,parsed);
  }
  const group=new THREE.Group();
  parsed.forEach(part=>{
    if(materialMap[part.name]===false) return;
    const material=materialMap[part.name]||materialMap.default;
    const mesh=new THREE.Mesh(
      part.geometry.clone(),
      material&&material.clone?material.clone():material
    );
    mesh.castShadow=true;
    mesh.receiveShadow=true;
    group.add(mesh);
  });
  return group;
}

function setTextureColorSpace(texture){
  if('colorSpace' in texture && THREE.SRGBColorSpace) texture.colorSpace=THREE.SRGBColorSpace;
  else if('encoding' in texture && THREE.sRGBEncoding) texture.encoding=THREE.sRGBEncoding;
}

function configureTexture(texture,repeatX,repeatY,isColor=true){
  texture.wrapS=THREE.RepeatWrapping;
  texture.wrapT=THREE.RepeatWrapping;
  texture.repeat.set(repeatX,repeatY);
  if(isColor) setTextureColorSpace(texture);
  if(renderer&&renderer.capabilities&&renderer.capabilities.getMaxAnisotropy){
    texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  }
  return texture;
}

function createCanvasTexture(draw,width,height,repeatX,repeatY,isColor=true){
  const canvas=document.createElement('canvas');
  canvas.width=width;
  canvas.height=height;
  const ctx=canvas.getContext('2d');
  draw(ctx,width,height);
  return configureTexture(new THREE.CanvasTexture(canvas),repeatX,repeatY,isColor);
}

function createAsphaltTexture(){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle='#60656b';
    ctx.fillRect(0,0,w,h);
    for(let i=0;i<6000;i++){
      const x=Math.random()*w;
      const y=Math.random()*h;
      const size=Math.random()*2.4+0.4;
      const shade=75+Math.random()*55;
      ctx.fillStyle=`rgba(${shade},${shade},${shade},${Math.random()*.28+.08})`;
      ctx.fillRect(x,y,size,size);
    }
    for(let i=0;i<160;i++){
      ctx.strokeStyle=`rgba(255,255,255,${Math.random()*.05+.02})`;
      ctx.lineWidth=Math.random()*1.2+.3;
      ctx.beginPath();
      ctx.moveTo(Math.random()*w,Math.random()*h);
      ctx.lineTo(Math.random()*w,Math.random()*h);
      ctx.stroke();
    }
  },512,512,5,5,true);
}

function createConcreteTexture(){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle='#cfc9bf';
    ctx.fillRect(0,0,w,h);
    for(let i=0;i<2200;i++){
      const x=Math.random()*w;
      const y=Math.random()*h;
      const shade=180+Math.random()*45;
      ctx.fillStyle=`rgba(${shade},${shade-4},${shade-8},${Math.random()*.18+.06})`;
      ctx.fillRect(x,y,Math.random()*3+1,Math.random()*3+1);
    }
    ctx.strokeStyle='rgba(110,110,110,.18)';
    ctx.lineWidth=2;
    for(let x=0;x<w;x+=96){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    }
    for(let y=0;y<h;y+=96){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
  },512,512,8,6,true);
}

function createPavingTexture(base='#d9d1c6',joint='rgba(120,112,102,.2)',accent='rgba(255,255,255,.08)'){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle=base;
    ctx.fillRect(0,0,w,h);
    const cols=8;
    const rows=6;
    const tileW=w/cols;
    const tileH=h/rows;
    for(let row=0;row<rows;row++){
      for(let col=0;col<cols;col++){
        const x=col*tileW;
        const y=row*tileH;
        const shift=(row%2)*tileW*.16;
        const tone=212+Math.random()*24;
        ctx.fillStyle=`rgba(${tone},${tone-6},${tone-12},${Math.random()*.22+.12})`;
        ctx.fillRect(x+shift,y,tileW-.5,tileH-.5);
      }
    }
    ctx.strokeStyle=joint;
    ctx.lineWidth=2;
    for(let x=0;x<=w;x+=tileW){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    }
    for(let y=0;y<=h;y+=tileH){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
    for(let i=0;i<2600;i++){
      const x=Math.random()*w;
      const y=Math.random()*h;
      ctx.fillStyle=accent;
      ctx.fillRect(x,y,Math.random()*2+.4,Math.random()*2+.4);
    }
  },512,512,5,4,true);
}

function createRoofGlassTexture(){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle='rgba(225,231,232,.94)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,.28)';
    for(let x=18;x<w;x+=44){
      ctx.fillRect(x,0,5,h);
    }
    ctx.strokeStyle='rgba(117,128,134,.28)';
    ctx.lineWidth=2;
    for(let y=0;y<h;y+=28){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
    }
  },512,256,1,1,true);
}

function createRoofTexture(base='#7d6250',accent='#5d4839'){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle=base;
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(255,255,255,.08)';
    for(let y=0;y<h;y+=28){
      ctx.fillRect(0,y,w,4);
    }
    ctx.fillStyle=accent;
    for(let y=10;y<h;y+=28){
      for(let x=(y/2)%26;x<w;x+=26){
        ctx.fillRect(x,y,14,10);
      }
    }
  },512,512,2,2,true);
}

function createCanopyMaterial(color){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:.82,
    metalness:.06
  });
}

function createGlassMaterial(tint){
  return new THREE.MeshStandardMaterial({
    color:tint||0x90a6bb,
    emissive:0x1e2d40,
    roughness:.18,
    metalness:.12
  });
}

function addShadowProps(mesh){
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  return mesh;
}

function addMesh(group,mesh){
  group.add(addShadowProps(mesh));
  return mesh;
}

function createBuilding(spec,textures){
  const group=new THREE.Group();
  const wallMap=spec.wallMap===false?null:(spec.wallMap||textures.brick);
  const bumpMap=spec.bumpMap===false?null:(spec.bumpMap||textures.brickBump);
  const wallMaterial=new THREE.MeshStandardMaterial({
    map:wallMap,
    bumpMap:bumpMap,
    bumpScale:bumpMap ? .18 : 0,
    color:spec.wall,
    roughness:.95,
    metalness:.02
  });
  const roofMaterial=new THREE.MeshStandardMaterial({
    map:spec.roofTexture,
    color:spec.roofColor,
    roughness:.92,
    metalness:.03
  });
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w,spec.h,spec.d),
    [wallMaterial,wallMaterial,roofMaterial,roofMaterial,wallMaterial,wallMaterial]
  );
  body.position.y=spec.h/2;
  addMesh(group,body);

  const trim=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w+.25,.18,spec.d+.25),
    new THREE.MeshStandardMaterial({color:0xb1a799,roughness:.88})
  );
  trim.position.y=.09;
  addMesh(group,trim);

  const roofCap=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w+.22,.22,spec.d+.22),
    new THREE.MeshStandardMaterial({color:spec.roofCap||0x666870,roughness:.9})
  );
  roofCap.position.y=spec.h+.11;
  addMesh(group,roofCap);

  const parapet=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w-.4,.28,spec.d-.4),
    new THREE.MeshStandardMaterial({color:spec.roofParapet||0xb6afa4,roughness:.94})
  );
  parapet.position.y=spec.h+.25;
  addMesh(group,parapet);

  const entrance=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w*.22,spec.h*.45,.2),
    new THREE.MeshStandardMaterial({color:0x353d4a,roughness:.52})
  );
  entrance.position.set(0,spec.h*.225,spec.d/2+.11);
  addMesh(group,entrance);

  const canopy=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w*.28,.1,.75),
    createCanopyMaterial(spec.canopy||0x546a8b)
  );
  canopy.position.set(0,spec.h*.42,spec.d/2+.38);
  addMesh(group,canopy);

  const canopyPosts=[-.46,.46];
  canopyPosts.forEach(offset=>{
    const post=new THREE.Mesh(
      new THREE.BoxGeometry(.06,spec.h*.42,.06),
      new THREE.MeshStandardMaterial({color:0x727985,roughness:.64,metalness:.25})
    );
    post.position.set(offset,spec.h*.21,spec.d/2+.34);
    addMesh(group,post);
  });

  if(spec.refinedEntrance!==false){
    const vestibuleFrameMaterial=new THREE.MeshStandardMaterial({color:0xbbb2a7,roughness:.86});
    const vestibuleGlassMaterial=createGlassMaterial(spec.glass||0x98aec0);
    const vestibule=new THREE.Mesh(
      new THREE.BoxGeometry(spec.w*.27,spec.h*.52,.52),
      new THREE.MeshStandardMaterial({color:0xe7e1d9,roughness:.94})
    );
    vestibule.position.set(0,spec.h*.26,spec.d/2+.22);
    addMesh(group,vestibule);
    const vestibuleGlass=new THREE.Mesh(
      new THREE.PlaneGeometry(spec.w*.21,spec.h*.42),
      vestibuleGlassMaterial
    );
    vestibuleGlass.position.set(0,spec.h*.24,spec.d/2+.49);
    group.add(vestibuleGlass);
    [-spec.w*.095,spec.w*.095].forEach(offset=>{
      const sideGlass=new THREE.Mesh(
        new THREE.PlaneGeometry(.22,spec.h*.36),
        vestibuleGlassMaterial
      );
      sideGlass.position.set(offset,spec.h*.24,spec.d/2+.51);
      group.add(sideGlass);
    });
    const vestibuleCap=new THREE.Mesh(
      new THREE.BoxGeometry(spec.w*.3,.08,.66),
      vestibuleFrameMaterial
    );
    vestibuleCap.position.set(0,spec.h*.52,spec.d/2+.32);
    addMesh(group,vestibuleCap);
    const doorDivider=new THREE.Mesh(
      new THREE.BoxGeometry(.05,spec.h*.36,.05),
      new THREE.MeshStandardMaterial({color:0xc8bfb4,roughness:.86})
    );
    doorDivider.position.set(0,spec.h*.23,spec.d/2+.48);
    addMesh(group,doorDivider);
  }

  const stepDepth=spec.d/2+.42;
  [-.42,0,.42].forEach((offset,idx)=>{
    const step=new THREE.Mesh(
      new THREE.BoxGeometry(spec.w*.22-idx*.18,.08,.34),
      new THREE.MeshStandardMaterial({color:0xc3b9aa,roughness:.96})
    );
    step.position.set(0,.04+idx*.08,stepDepth+offset*.05);
    addMesh(group,step);
  });

  if(spec.facadeTitle){
    const titleCanvas=document.createElement('canvas');
    titleCanvas.width=1024;
    titleCanvas.height=220;
    const tctx=titleCanvas.getContext('2d');
    tctx.fillStyle='#8a372c';
    tctx.fillRect(0,0,titleCanvas.width,titleCanvas.height);
    tctx.fillStyle='#f0e3bf';
    tctx.font='bold 92px Microsoft YaHei';
    tctx.textAlign='center';
    tctx.textBaseline='middle';
    tctx.fillText(spec.facadeTitle,titleCanvas.width/2,titleCanvas.height/2);
    const titleTexture=new THREE.CanvasTexture(titleCanvas);
    setTextureColorSpace(titleTexture);
    const titleBoard=new THREE.Mesh(
      new THREE.PlaneGeometry(Math.min(spec.w*.46,5.8),.9),
      new THREE.MeshStandardMaterial({map:titleTexture,roughness:.84,metalness:.05})
    );
    titleBoard.position.set(0,spec.h*.66,spec.d/2+.09);
    group.add(titleBoard);
  }

  const glassMaterial=createGlassMaterial(spec.glass||0x8fa8bb);
  const litMaterial=createGlassMaterial(spec.litGlass||0xcac3a9);
  const stories=Math.max(2,Math.floor(spec.h/1.35));
  const cols=Math.max(2,Math.floor(spec.w/1.55));
  const rows=stories;
  const xStart=-spec.w/2+.75;
  const xEnd=spec.w/2-.75;
  const yStart=1.05;
  const yStep=(spec.h-1.6)/rows;
  const xStep=cols===1?0:(xEnd-xStart)/(cols-1);
  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      const frame=new THREE.Mesh(
        new THREE.PlaneGeometry(.62,.86),
        new THREE.MeshStandardMaterial({color:0xddd7ca,roughness:.9})
      );
      frame.position.set(xStart+col*xStep,yStart+row*yStep,spec.d/2+.024);
      group.add(frame);
      const win=new THREE.Mesh(
        new THREE.PlaneGeometry(.48,.72),
        (row+col)%4===0?litMaterial:glassMaterial
      );
      win.position.set(xStart+col*xStep,yStart+row*yStep,spec.d/2+.03);
      group.add(win);
      const mullionV=new THREE.Mesh(
        new THREE.PlaneGeometry(.028,.68),
        new THREE.MeshStandardMaterial({color:0xe8e1d7,roughness:.88})
      );
      mullionV.position.set(xStart+col*xStep,yStart+row*yStep,spec.d/2+.034);
      group.add(mullionV);
      const mullionH=new THREE.Mesh(
        new THREE.PlaneGeometry(.44,.026),
        new THREE.MeshStandardMaterial({color:0xe8e1d7,roughness:.88})
      );
      mullionH.position.set(xStart+col*xStep,yStart+row*yStep,spec.d/2+.034);
      group.add(mullionH);
      const sill=new THREE.Mesh(
        new THREE.BoxGeometry(.56,.05,.08),
        new THREE.MeshStandardMaterial({color:0xc3baab,roughness:.95})
      );
      sill.position.set(xStart+col*xStep,yStart+row*yStep-.42,spec.d/2+.06);
      addMesh(group,sill);
    }
  }

  const sideRows=Math.max(2,rows-1);
  const sideCols=Math.max(2,Math.floor(spec.d/1.8));
  const zStart=-spec.d/2+.8;
  const zEnd=spec.d/2-.8;
  const zStep=sideCols===1?0:(zEnd-zStart)/(sideCols-1);
  for(let row=0;row<sideRows;row++){
    for(let col=0;col<sideCols;col++){
      const leftFrame=new THREE.Mesh(new THREE.PlaneGeometry(.5,.74),new THREE.MeshStandardMaterial({color:0xd7d0c3,roughness:.88}));
      leftFrame.position.set(-spec.w/2-.022,1+row*((spec.h-1.8)/sideRows),zStart+col*zStep);
      leftFrame.rotation.y=Math.PI/2;
      group.add(leftFrame);
      const leftWin=new THREE.Mesh(new THREE.PlaneGeometry(.4,.62),glassMaterial);
      leftWin.position.set(-spec.w/2-.03,1+row*((spec.h-1.8)/sideRows),zStart+col*zStep);
      leftWin.rotation.y=Math.PI/2;
      group.add(leftWin);

      const rightFrame=leftFrame.clone();
      rightFrame.position.x=spec.w/2+.022;
      rightFrame.rotation.y=-Math.PI/2;
      group.add(rightFrame);

      const rightWin=leftWin.clone();
      rightWin.position.x=spec.w/2+.03;
      rightWin.rotation.y=-Math.PI/2;
      group.add(rightWin);
    }
  }

  const columnCount=Math.max(2,Math.floor(spec.w/2.2));
  for(let i=0;i<columnCount;i++){
    const x=-spec.w/2+.75+i*((spec.w-1.5)/(columnCount-1));
    const pilaster=new THREE.Mesh(
      new THREE.BoxGeometry(.1,spec.h-.2,.12),
      new THREE.MeshStandardMaterial({color:0xbbae9f,roughness:.9})
    );
    pilaster.position.set(x,(spec.h-.2)/2,spec.d/2+.07);
    addMesh(group,pilaster);
  }

  if(spec.windowBandColor){
    for(let row=0;row<Math.max(2,Math.floor(rows/2));row++){
      const band=new THREE.Mesh(
        new THREE.BoxGeometry(spec.w-.9,.14,.09),
        new THREE.MeshStandardMaterial({color:spec.windowBandColor,roughness:.8})
      );
      band.position.set(0,1.1+row*((spec.h-1.8)/Math.max(1,Math.floor(rows/2))),spec.d/2+.08);
      addMesh(group,band);
    }
  }

  const hvacBase=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w*.18,.25,spec.d*.14),
    new THREE.MeshStandardMaterial({color:0x737b83,roughness:.76,metalness:.18})
  );
  hvacBase.position.set(spec.w*.18,spec.h+.42,-spec.d*.16);
  addMesh(group,hvacBase);
  const hvacCap=new THREE.Mesh(
    new THREE.BoxGeometry(spec.w*.16,.1,spec.d*.12),
    new THREE.MeshStandardMaterial({color:0x8f98a1,roughness:.72,metalness:.22})
  );
  hvacCap.position.copy(hvacBase.position).add(new THREE.Vector3(0,.17,0));
  addMesh(group,hvacCap);

  const ventPipe=new THREE.Mesh(
    new THREE.CylinderGeometry(.06,.06,.5,10),
    new THREE.MeshStandardMaterial({color:0x8f918f,roughness:.72,metalness:.28})
  );
  ventPipe.position.set(-spec.w*.12,spec.h+.42,spec.d*.08);
  addMesh(group,ventPipe);

  group.position.set(spec.x,0,spec.z);
  return group;
}

function createTrackTexture(){
  return createCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle='#b24e3e';
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,245,230,.78)';
    ctx.lineWidth=4;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.ellipse(w/2,h/2,w*.43-i*22,h*.32-i*18,0,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.fillStyle='#6f9c5a';
    ctx.beginPath();
    ctx.ellipse(w/2,h/2,w*.24,h*.16,0,0,Math.PI*2);
    ctx.fill();
  },1024,512,1,1,true);
}

function addRoadMarkings(parent){
  const lineMaterial=new THREE.MeshStandardMaterial({color:0xf6f6f2,roughness:.8});
  for(let i=-17;i<=17;i+=3.4){
    const dash=new THREE.Mesh(new THREE.PlaneGeometry(1.05,.14),lineMaterial);
    dash.rotation.x=-Math.PI/2;
    dash.position.set(i,.022,ROAD_H_Z);
    parent.add(dash);
  }
  for(let i=0;i<6;i++){
    const stripe=new THREE.Mesh(new THREE.PlaneGeometry(.42,1.3),lineMaterial);
    stripe.rotation.x=-Math.PI/2;
    stripe.position.set(-1.4+i*.58,.023,ROAD_H_Z);
    parent.add(stripe);
  }
}

function createBike(color){
  const group=new THREE.Group();
  const tireMaterial=new THREE.MeshStandardMaterial({color:0x262b30,roughness:.94});

  const bodyPanelMaterial=new THREE.MeshStandardMaterial({color:THREE.Color.prototype.clone?new THREE.Color(color).multiplyScalar(.92):color,roughness:.36,metalness:.1});

  const wheelGeo=new THREE.TorusGeometry(.56,.06,16,32);

    new THREE.MeshStandardMaterial({map:campusTexture,transparent:true,opacity:.84,depthWrite:false})
  );
  campusMark.rotation.x=-Math.PI/2;
  campusMark.position.set((PARKING.x1+PARKING.x2)/2,.021,PARKING.z2+.95);
  scene.add(campusMark);

  const textures={
    brick:brickTexture,
    brickBump:brickBump,
    grass:grassTexture
  };
  scene.add(createSchoolBackdrop(textures));
  const canopy=createParkingCanopyRealistic();
  canopy.position.set(0,0,-.08);
  scene.add(canopy);

  [
    [-21.8,-11.7,1.08],[-18.6,-8.8,1.02],[-15.2,-13.1,1.05],[-8.4,-13.6,1],
    [8.6,-13.6,1],[15.2,-13,1.05],[18.8,-9.1,1.02],[21.6,-11.8,1.08],
    [-21.6,2.8,1.02],[-18.8,6.5,1.05],[-16.2,12.7,1.08],[16.2,12.6,1.08],
    [18.9,6.3,1.05],[21.4,2.6,1.02]
  ].forEach(t=>scene.add(createTree(t[0],t[1],t[2])));

  [
    [-15.8,14.6,2.8],[-8.1,7.2,2.7],[8.1,7.2,2.7],[15.8,14.6,2.8]
  ].forEach(t=>scene.add(createStreetLamp(t[0],t[1],t[2])));

  [
    [-14.8,-6.2,.94],[-13.6,-6,.98],[-12.4,-6.2,.94],[-11.2,-6.1,.98],
    [11.2,-6.1,.98],[12.4,-6.2,.94],[13.6,-6,.98],[14.8,-6.2,.94],
    [-8,2.8,.92],[-6.8,2.5,.96],[-5.6,2.8,.92]
  ].forEach(item=>scene.add(createShrub(item[0],item[1],item[2])));

  const benchMaterial=new THREE.MeshStandardMaterial({color:0x795f4f,roughness:.92});
  [
    {x:-4.4,z:-7.4,r:.12},
    {x:4.4,z:-7.4,r:.12}
  ].forEach(spec=>{
    const seat=new THREE.Mesh(new THREE.BoxGeometry(1.1,.08,.32),benchMaterial);
    seat.position.set(spec.x,.52,spec.z);
    addShadowProps(seat);
    scene.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(1.1,.46,.08),benchMaterial);
    back.position.set(spec.x,.74,spec.z-.12);
    addShadowProps(back);
    scene.add(back);
    [-.44,.44].forEach(offset=>{
      const leg=new THREE.Mesh(new THREE.BoxGeometry(.08,.52,.08),new THREE.MeshStandardMaterial({color:0x4b4f54,roughness:.78}));
      leg.position.set(spec.x+offset,.26,spec.z);
      addShadowProps(leg);
      scene.add(leg);
    });
  });

  const sceneLabel=document.getElementById('sceneHint');
  sceneLabel.classList.add('hidden');
  window.addEventListener('resize',onResize);
  anim();
}

function onResize(){
  camera.aspect=sceneBox.clientWidth/sceneBox.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(sceneBox.clientWidth,sceneBox.clientHeight);
}

function anim(){
  requestAnimationFrame(anim);
  renderer.render(scene,camera);
}

function placeBike(idx,x,z){
  const inPark=isInPark(x,z);
  const b=createBike(bikeColor(idx));
  b.position.set(x,0,z);
  scene.add(b);
  placed[idx]={mesh:b,idx,x,z,com:inPark};
  st();
  toast(inPark?'✅ 合规':'❌ 违规',inPark?'ok':'err');
}

function moveBike(idx,x,z){
  if(!placed[idx]) return;
  const inPark=isInPark(x,z);
  scene.remove(placed[idx].mesh);
  const b=createBike(bikeColor(idx));
  b.position.set(x,0,z);
  scene.add(b);
  placed[idx]={mesh:b,idx,x,z,com:inPark};
  st();
  toast(inPark?'✅ 合规':'❌ 违规',inPark?'ok':'err');
}

function setup3DDrag(){
  const cv=renderer.domElement;
  let sel=null,sIdx=-1,active=false,plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();
  cv.addEventListener('mousedown',e=>{
    const r=cv.getBoundingClientRect();
    const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    const ray=new THREE.Raycaster();
    ray.setFromCamera(m,camera);
    const bikes=Object.values(placed).filter(p=>p.mesh).map(p=>p.mesh);
    const hits=ray.intersectObjects(bikes,true);
    if(hits.length>0){
      let o=hits[0].object;
      while(o.parent&&!Object.values(placed).find(p=>p.mesh===o)) o=o.parent;
      const en=Object.values(placed).find(p=>p.mesh===o);
      if(en){
        sel=en.mesh;
        sIdx=en.idx;
        active=true;
        ray.ray.intersectPlane(plane,pt);
        drag.offX=pt.x-sel.position.x;
        drag.offZ=pt.z-sel.position.z;
      }
    }
  });
  cv.addEventListener('mousemove',e=>{
    if(!active||!sel) return;
    const r=cv.getBoundingClientRect();
    const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    const ray=new THREE.Raycaster();
    ray.setFromCamera(m,camera);
    ray.ray.intersectPlane(plane,pt);
    sel.position.set(
      Math.max(-21,Math.min(21,pt.x-drag.offX)),
      0,
      Math.max(-14,Math.min(14,pt.z-drag.offZ))
    );
  });
  cv.addEventListener('mouseup',()=>{
    if(!active||!sel||sIdx<0){active=false;return}
    const x=sel.position.x,z=sel.position.z;
    if(placed[sIdx]){
      const inPark=isInPark(x,z);
      placed[sIdx].x=x;
      placed[sIdx].z=z;
      placed[sIdx].com=inPark;
      scene.remove(sel);
      const b=createBike(bikeColor(sIdx));
      b.position.set(x,0,z);
      scene.add(b);
      placed[sIdx].mesh=b;
      st();
    }
    sel=null;
    sIdx=-1;
    active=false;
  });
}

async function detectAll(){
  if(LOCAL_MODE){
    toast('💡 检测接口请通过 http://127.0.0.1:5000 打开使用','info');
    return;
  }
  const btn=document.getElementById('btnDetect');
  btn.disabled=true;
  btn.textContent='⏳检测...';
  for(let i=0;i<IMGS.length;i++){
    try{
      const r=await fetch('/api/detect',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({file:IMGS[i].file})
      });
      const d=await r.json();
      IMGS[i].detected=true;
      IMGS[i].isBike=d.has_bicycle;
    }catch(e){}
    renderCards();
  }
  btn.disabled=false;
  btn.textContent='🔍 YOLO检测';
  toast('✅检测完成','ok');
}

function renderCards(){
  const c=document.getElementById('cards');
  c.innerHTML='';
  IMGS.forEach((img,i)=>{
    const cd=document.createElement('div');
    cd.className='card';
    cd.dataset.idx=i;
    const badge=img.detected
      ? img.isBike
        ? '<span class="badge badge-ok">🚲</span>'
        : '<span class="badge badge-no">❌</span>'
      : '<span class="badge badge-wait">⏳</span>';
    cd.innerHTML=badge+'<img src="'+img.url+'"><div class="label">'+img.label+'</div>';
    cd.onmousedown=e=>{
      if(!camera){toast('⏳3D场景未就绪','info');return}
      if(img.detected&&!img.isBike){toast('❌非自行车','info');return}
      if(placed[i]&&placed[i].mesh){toast('🔄已放置，在场景中拖动','info');return}
      drag.active=true;
      drag.source='card';
      drag.bikeIdx=i;
      const cl=document.createElement('img');
      cl.src=img.url;
      cl.style.cssText='position:fixed;width:112px;height:82px;object-fit:cover;border-radius:10px;z-index:1000;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.45)';
      document.body.appendChild(cl);
      drag.clone=cl;
      drag.offX=56;
      drag.offY=41;
      cl.style.left=(e.clientX-56)+'px';
      cl.style.top=(e.clientY-41)+'px';
      const mv=e2=>{
        if(drag.clone){
          drag.clone.style.left=(e2.clientX-56)+'px';
          drag.clone.style.top=(e2.clientY-41)+'px';
        }
      };
      const up=e2=>{
        document.removeEventListener('mousemove',mv);
        document.removeEventListener('mouseup',up);
        if(drag.clone){drag.clone.remove();drag.clone=null}
        if(!drag.active||!camera||drag.bikeIdx<0){drag.active=false;return}
        const cv=document.querySelector('#scene3d canvas');
        if(!cv){drag.active=false;return}
        let x=0,z=0;
        try{
          const r=cv.getBoundingClientRect();
          if(e2.clientX>=r.left&&e2.clientX<=r.right&&e2.clientY>=r.top&&e2.clientY<=r.bottom){
            const m=new THREE.Vector2(((e2.clientX-r.left)/r.width)*2-1,-((e2.clientY-r.top)/r.height)*2+1);
            const ray=new THREE.Raycaster();
            ray.setFromCamera(m,camera);
            const plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
            const pt=new THREE.Vector3();
            if(ray.ray.intersectPlane(plane,pt)){
              x=Math.max(-21,Math.min(21,pt.x));
              z=Math.max(-14,Math.min(14,pt.z));
            }
          }
        }catch(err){console.error('drop err',err)}
        if(placed[drag.bikeIdx]&&placed[drag.bikeIdx].mesh) moveBike(drag.bikeIdx,x,z);
        else placeBike(drag.bikeIdx,x,z);
        drag.active=false;
        drag.source=null;
        drag.bikeIdx=-1;
      };
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    };
    c.appendChild(cd);
  });
}

async function loadImgs(){
  if(LOCAL_MODE){
    IMGS=FALLBACK_IMAGES.map(img=>({
      ...img,
      url:'../'+img.file,
      detected:false,
      isBike:true
    }));
    renderCards();
    return;
  }
  try{
    const r=await fetch('/api/images');
    IMGS=await r.json();
    IMGS.forEach(x=>{x.detected=false;x.isBike=false});
    renderCards();
  }catch(e){
    IMGS=FALLBACK_IMAGES.map(img=>({
      ...img,
      url:'../'+img.file,
      detected:false,
      isBike:true
    }));
    renderCards();
  }
}

function st(){
  const vs=Object.values(placed).filter(p=>p.mesh);
  document.getElementById('ctOk').textContent=vs.filter(v=>v.com).length;
  document.getElementById('ctBad').textContent=vs.filter(v=>!v.com).length;
  document.getElementById('ctPlaced').textContent=vs.length;
}

function toast(m,t){
  const o=document.getElementById('toast');
  o.textContent=m;
  o.className='toast show '+t;
  clearTimeout(o._timer);
  o._timer=setTimeout(()=>o.classList.remove('show'),2000);
}

function resetAll(){
  Object.values(placed).filter(p=>p.mesh).forEach(p=>scene.remove(p.mesh));
  placed={};
  st();
  toast('🔄已重置','info');
}

let gestureEnabled=false,gestureReady=false;
const gesture={isPinching:false,x:0,y:0,prev:false};
function toggleGesture(){gestureEnabled?stopGesture():initGesture()}
function initGesture(){
  const btn=document.getElementById('btnGesture');
  btn.textContent='✋加载中';
  btn.disabled=true;
  const video=document.getElementById('webcam');
  document.getElementById('camBox').style.display='block';
  const hands=new Hands({locateFile:f=>assetPath('static/'+f)});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.3,minTrackingConfidence:.3});
  hands.onResults(r=>{
    if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){
      const lm=r.multiHandLandmarks[0],t=lm[4],i=lm[8];
      gesture.x=(1-i.x)*window.innerWidth;
      gesture.y=i.y*window.innerHeight;
      const pxDist=Math.hypot((t.x-i.x)*window.innerWidth,(t.y-i.y)*window.innerHeight);
      gesture.prev=gesture.isPinching;
      gesture.isPinching=pxDist<50;
      document.getElementById('gestureStatus').textContent='🖐️手部已识别'+(gesture.isPinching?' 🤏捏合中':'');
      const c=document.getElementById('cursor');
      c.style.display='block';
      c.style.left=gesture.x+'px';
      c.style.top=gesture.y+'px';
      c.className=gesture.isPinching?'pinch':'';
      const me=type=>new MouseEvent(type,{clientX:gesture.x,clientY:gesture.y,bubbles:true});
      const cv=document.querySelector('#scene3d canvas');
      if(gesture.isPinching&&!gesture.prev){
        const el=document.elementFromPoint(gesture.x,gesture.y);
        if(el) el.dispatchEvent(me('mousedown'));
        if(cv&&cv!==el) cv.dispatchEvent(me('mousedown'));
      }else if(gesture.isPinching&&gesture.prev){
        document.dispatchEvent(me('mousemove'));
        if(cv) cv.dispatchEvent(me('mousemove'));
      }else if(!gesture.isPinching&&gesture.prev){
        document.dispatchEvent(me('mouseup'));
        if(cv) cv.dispatchEvent(me('mouseup'));
      }
    }else{
      gesture.prev=gesture.isPinching;
      gesture.isPinching=false;
      document.getElementById('cursor').style.display='none';
      document.getElementById('gestureStatus').textContent='⏳未检测到手';
    }
  });
  new Camera(video,{
    onFrame:async()=>{await hands.send({image:video})},
    width:320,
    height:240
  }).start().then(()=>{
    gestureReady=true;
    gestureEnabled=true;
    btn.textContent='✋手势:开';
    btn.className='btn btn-purple active';
    btn.disabled=false;
  }).catch(()=>{
    btn.textContent='✋失败';
    btn.disabled=false;
  });
}

function stopGesture(){
  gestureEnabled=false;
  gestureReady=false;
  document.getElementById('camBox').style.display='none';
  document.getElementById('cursor').style.display='none';
  const btn=document.getElementById('btnGesture');
  btn.textContent='✋手势:关';
  btn.className='btn btn-purple';
}

loadImgs();
let _wait=0;
function _try(){
  if(typeof THREE!=='undefined'){
    initScene();
    setup3DDrag();
  }else if(_wait++<50){
    document.getElementById('sceneHint').innerHTML='<div class="icon">⏳</div><p>加载 Three.js 中...</p>';
    setTimeout(_try,200);
  }else{
    document.getElementById('sceneHint').innerHTML='<div class="icon">❌</div><p>3D 场景加载失败</p>';
  }
}
setTimeout(_try,100);
</script>
